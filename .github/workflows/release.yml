name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) VERSION="${TAG#v}.0" ;; *) VERSION="0.0.0.0" ;; esac
          dotnet publish src/Jellyfin.Plugin.SeasonBadge -c Release -o out -p:Version="$VERSION"
          ZIP="season-badge_${VERSION}.zip"
          (cd out && zip "../$ZIP" Jellyfin.Plugin.SeasonBadge.dll)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Manifest
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os
          zip_name = os.environ["ZIP"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          with open(zip_name, "rb") as f:
              checksum = hashlib.md5(f.read()).hexdigest()
          manifest = [{
              "guid": "4298b1d5-858b-4417-98aa-bb6c6895b61c",
              "name": "Season Badge",
              "overview": "Completeness badges on season and series posters",
              "description": "Shows on season and series posters whether all aired episodes are in your library. Requires the File Transformation plugin.",
              "owner": repo.split("/")[0],
              "category": "General",
              "versions": [{
                  "version": os.environ["VERSION"],
                  "changelog": f"https://github.com/{repo}/releases/tag/{tag}",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": f"https://github.com/{repo}/releases/download/{tag}/{zip_name}",
                  "checksum": checksum,
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              }],
          }]
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: season-badge
          path: |
            ${{ env.ZIP }}
            manifest.json

      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" manifest.json --title "$GITHUB_REF_NAME" --generate-notes
