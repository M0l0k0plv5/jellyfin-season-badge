name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch breaking changes in new Jellyfin releases
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.0.0', '12.*']
    name: build (Jellyfin ${{ matrix.jellyfin }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Jellyfin.Plugin.SeasonBadge -c Release -p:JellyfinVersion="${{ matrix.jellyfin }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
